# Consulta Supabase cada 3 días para que el plan gratuito no pause el proyecto por inactividad.
# Solo lee el catálogo público de planes con la clave pública (la misma de clases.html).
name: Mantener Supabase activo

on:
  schedule:
    - cron: "17 14 */3 * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar el catálogo de planes
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://zdrtfhnppwvoxnphfnkg.supabase.co/rest/v1/plans?select=name&limit=1" \
            -H "apikey: sb_publishable_EyMnwp0U5d4yaKGndamxXQ_wVxhkC8c")
          echo "Supabase respondió $status"
          test "$status" = "200"
