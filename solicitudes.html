  const esc=t=>String(t??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const app=document.getElementById("app");let tab="solicitudes",reqs=[],msgs=[],q="";
  const fmtDate=s=>new Date(s).toLocaleString("es-CR",{dateStyle:"medium",timeStyle:"short",timeZone:"America/Costa_Rica"});
  const money=n=>"₡"+Math.round(Number(n)||0).toLocaleString("en-US").replace(/,/g,".");
  const wa=t=>{const d=String(t||"").replace(/\D/g,"");return d.length>=8?`https://wa.me/${d.length===8?"506"+d:d}`:""};
  function render(){const term=q.toLowerCase();
    const tabs=`<div class="tabs" role="tablist"><button role="tab" data-tab="solicitudes" aria-selected="${tab==="solicitudes"}">Recomendador (${reqs.length})</button><button role="tab" data-tab="mensajes" aria-selected="${tab==="mensajes"}">Contacto (${msgs.filter(m=>!m.leido).length} sin leer)</button></div>`;
    const tools=`<div class="toolbar"><input class="search" id="q" type="search" placeholder="Buscar por nombre, objetivo u horario" value="${esc(q)}" aria-label="Buscar"><button class="btn btn-outline" data-action="reload">Actualizar</button></div>`;
    let body;
    if(tab==="solicitudes"){const list=reqs.filter(r=>JSON.stringify(r).toLowerCase().includes(term));
      body=list.length?list.map(r=>{const link=wa(r.contacto);return`<article class="req"><div class="req-top"><h3>${esc(r.nombre||"Sin nombre")}${r.para_quien?` · <span class="muted" style="font-weight:500">${esc(r.para_quien)}</span>`:""}</h3><time>${fmtDate(r.created_at)}</time></div>
      <dl><dt>Objetivo</dt><dd>${esc(r.objetivos)}</dd><dt>Experiencia</dt><dd>${esc(r.experiencia)}</dd><dt>Horarios</dt><dd>${esc(r.disponibilidad)}</dd><dt>Personas</dt><dd>${esc(r.personas??"")}</dd>
      <dt>Recomendado</dt><dd><span class="pill">${r.paquete_clases} clases · ${r.paquete_personas} pers. · ${money(r.paquete_precio)}</span> ${esc(r.tipo_clase||"")}</dd>${r.contacto?`<dt>Contacto</dt><dd>${esc(r.contacto)}</dd>`:""}</dl>
      <div class="actions" style="margin-top:12px">${link?`<a class="btn btn-agua" href="${link}" target="_blank" rel="noopener">Escribir por WhatsApp</a>`:""}<button class="btn btn-danger" data-del-req="${r.id}">Eliminar</button></div></article>`}).join(""):'<p class="empty">Todavía no hay solicitudes.</p>';
    }else{const list=msgs.filter(m=>JSON.stringify(m).toLowerCase().includes(term));
      body=list.length?list.map(m=>{const link=wa(m.telefono);return`<article class="req${m.leido?"":" unread"}"><div class="req-top"><h3>${esc(m.nombre)} <span class="pill">${esc(m.motivo||"")}</span></h3><time>${fmtDate(m.created_at)}</time></div><p style="white-space:pre-wrap">${esc(m.mensaje)}</p><p class="muted">${esc(m.telefono||"")} ${m.correo?`· <a href="mailto:${esc(m.correo)}">${esc(m.correo)}</a>`:""}</p>
      <div class="actions">${link?`<a class="btn btn-agua" href="${link}" target="_blank" rel="noopener">WhatsApp</a>`:""}${m.leido?"":`<button class="btn btn-outline" data-read="${m.id}">Marcar leído</button>`}<button class="btn btn-danger" data-del-msg="${m.id}">Eliminar</button></div></article>`}).join(""):'<p class="empty">No hay mensajes.</p>';}
    app.innerHTML=tabs+tools+`<div class="req-list">${body}</div>`;
    const qi=document.getElementById("q");qi.oninput=()=>{q=qi.value;const pos=qi.selectionStart;render();const n=document.getElementById("q");n.focus();n.setSelectionRange(pos,pos)};}
  async function load(){const {data:{session}}=await sb.auth.getSession();
    if(!session){app.innerHTML='<div class="panel" style="max-width:560px"><h2>Solo para la profe</h2><p class="muted">Ingresá con tu cuenta de profe en la página de clases y volvé aquí.</p><a class="btn btn-lila" href="clases.html#ingresar">Ingresar</a></div>';return}
    const {data:prof}=await sb.from("profiles").select("role").eq("id",session.user.id).maybeSingle();
    if(!prof||prof.role!=="profe"){app.innerHTML='<div class="panel" style="max-width:560px"><h2>Sin acceso</h2><p class="muted">Esta página es solo para la profe Emily.</p></div>';return}
    const [a,b]=await Promise.all([sb.from("recommendation_requests").select("*").order("created_at",{ascending:false}).limit(300),sb.from("contact_messages").select("*").order("created_at",{ascending:false}).limit(300)]);
    if(a.error||b.error){app.innerHTML='<p class="error">No pudimos cargar los datos. Revisá que la base de datos esté actualizada.</p>';return}
    reqs=a.data;msgs=b.data;render();}
  app.addEventListener("click",async e=>{const el=e.target.closest("button");if(!el)return;
    if(el.dataset.tab){tab=el.dataset.tab;render();return}
    if(el.dataset.action==="reload"){load();return}
    if(el.dataset.read){await sb.from("contact_messages").update({leido:true}).eq("id",el.dataset.read);msgs=msgs.map(m=>m.id===el.dataset.read?{...m,leido:true}:m);render();return}
    const id=el.dataset.delReq||el.dataset.delMsg;if(id&&confirm("¿Eliminar este registro?")){const t=el.dataset.delReq?"recommendation_requests":"contact_messages";const {error}=await sb.from(t).delete().eq("id",id);if(!error){reqs=reqs.filter(r=>r.id!==id);msgs=msgs.filter(m=>m.id!==id);render()}}});
  load();})();
  </script>
</body>
</html>
