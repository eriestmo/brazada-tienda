  async function loadAdminPayments(){const ps=await result(sb.from("payments").select("*").order("year",{ascending:false}).order("month",{ascending:false}));const ids=[...new Set(ps.map(p=>p.account_id))];const profiles=ids.length?await result(sb.from("profiles").select("*").in("id",ids)):[];state.adminPayments=ps.map(paymentModel);state.adminUsers=profiles}
  function panelView(tab="agenda"){const todayKey=dateKey(agendaDate),todayOcc=genOccurrences(fromKey(todayKey),0),agenda=tab==="agenda"?todayOcc:[];const users=state.adminUsers.filter(x=>x.role==="alumno"),payments=state.adminPayments,month=crNow().getUTCMonth()+1,year=crNow().getUTCFullYear(),mp=payments.filter(p=>p.month===month&&p.year===year),collected=mp.filter(p=>p.status==="pagado").reduce((n,p)=>n+p.amount,0),pending=mp.filter(p=>p.status==="pendiente"||p.status==="en revisión").reduce((n,p)=>n+p.amount,0),overdue=mp.filter(p=>p.status==="vencido").reduce((n,p)=>n+p.amount,0);return`<section class="hero"><div><div class="eyebrow">Panel de Emily</div><h1>Su espacio de trabajo</h1><p class="hero-copy">Agenda, alumnos y pagos de sus clases.</p></div></section><section class="content-section"><div class="panel"><div class="tabs"><button data-action="panel-tab" data-tab="agenda" aria-selected="${tab==="agenda"}">Agenda</button><button data-action="panel-tab" data-tab="alumnos" aria-selected="${tab==="alumnos"}">Alumnos</button><button data-action="panel-tab" data-tab="pagos" aria-selected="${tab==="pagos"}">Pagos</button></div>${tab==="agenda"?`<div class="agenda-controls"><button class="icon-btn" data-action="agenda-shift" data-delta="-1">←</button><h2>${dateLabel(agendaDate,true)}</h2><button class="icon-btn" data-action="agenda-shift" data-delta="1">→</button></div><div class="list">${agenda.map(o=>{const list=allBookings(o);return`<article class="card"><h3>${escapeHTML(o.time)} · ${escapeHTML(CLASES[o.type].nombre)}</h3><p>${list.length} de ${CLASES[o.type].cupo} cupos · ${UBICACION}</p>${list.map(b=>{const s=state.students.find(x=>x.id===b.student_id),owner=state.adminUsers.find(x=>x.id===s?.account_id);return s?`<div class="student-line"><span><strong>${escapeHTML(s.name)}</strong> · ${escapeHTML(s.age)}<br><span class="muted">${escapeHTML(owner?.name||"")} · <a href="https://wa.me/${String(owner?.phone||"").replace(/\D/g,"")}" target="_blank" rel="noopener">${escapeHTML(owner?.phone||"")}</a></span></span><button class="copy-btn" data-action="admin-cancel-start" data-id="${b.id}">Cancelar reserva</button></div>`:""}).join("")||'<p class="muted">Sin reservas.</p>'}</article>`}).join("")||'<p class="empty">No hay clases en esta fecha.</p>'}</div>`:tab==="alumnos"?`<div class="scroll-table"><table><thead><tr><th>Titular</th><th>Alumnos</th><th>Plan</th><th>Próximo pago</th><th>Teléfono</th></tr></thead><tbody>${users.map(u=>{const ss=state.students.filter(s=>s.account_id===u.id),p=state.adminPayments.filter(x=>x.account_id===u.id)[0];return`<tr><td>${escapeHTML(u.name)}<br><span class="muted">${escapeHTML(u.email)}</span></td><td>${ss.map(s=>escapeHTML(s.name)).join(", ")||"—"}</td><td>${escapeHTML(u.plan||"—")}</td><td><span class="status status-${escapeHTML((p?.status||"pendiente").replace(/\s+/g,"-"))}">${escapeHTML(capitalize(p?.status||"pendiente"))}</span></td><td><a href="https://wa.me/${String(u.phone||"").replace(/\D/g,"")}" target="_blank" rel="noopener">${escapeHTML(u.phone||"")}</a></td></tr>`}).join("")}</tbody></table></div>`:`<div class="chips"><span class="chip">Cobrado este mes: ${money(collected)}</span><span class="chip">Pendiente: ${money(pending)}</span><span class="chip">Vencido: ${money(overdue)}</span></div><h2 style="margin-top:24px">Pagos por revisar</h2><div class="list">${payments.filter(p=>p.status==="en revisión"||p.status==="vencido").sort((a,b)=>(a.status==="en revisión"?0:1)-(b.status==="en revisión"?0:1)).map(p=>{const owner=state.adminUsers.find(u=>u.id===p.account_id);return`<article class="booking-card"><div><h3>${escapeHTML(owner?.name||"Cuenta")} · ${escapeHTML(p.period)}</h3><p>${money(p.amount)} · vence ${titleDate(p.dueDate)}</p><span class="status status-${escapeHTML(p.status.replace(/\s+/g,"-"))}">${escapeHTML(capitalize(p.status))}</span></div>${p.status!=="pagado"?`<button class="btn btn-agua" data-action="confirm-payment" data-id="${p.id}">Confirmar pago</button>`:""}</article>`}).join("")||'<p class="empty">No hay pagos vencidos ni en revisión.</p>'}</div>`}</div></section>`}
  function render(){accountLinkUpdate();if(!catalogReady){main.innerHTML=catalogError?`<section class="content-section"><div class="empty"><p>No se pudieron cargar las clases y horarios. Revise su conexión e intente de nuevo.</p><button class="btn btn-lila" data-action="retry">Reintentar</button></div></section>`:'<p class="loading">Cargando clases y horarios…</p>';return}const hash=location.hash.slice(1)||"clases";if(isAuthHash(location.hash)){main.innerHTML='<p class="loading">Verificando su cuenta…</p>';return}if(recoveryMode){main.innerHTML=authView();return}if(hash==="reservar")main.innerHTML=bookingView();else if(hash==="ingresar")main.innerHTML=authView(activeTab==="register"?"register":"login");else if(hash==="cuenta"&&currentUser()?.role==="alumno")main.innerHTML=accountView(activeTab);else if(hash==="panel"&&currentUser()?.role==="profe")main.innerHTML=panelView(activeTab==="agenda"||activeTab==="alumnos"?"agenda":activeTab);else main.innerHTML=publicView()}
  function toast(text){const el=$("#toast");el.textContent=text;el.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove("show"),3000)}
  function showDialog(title,html){$("#dialogTitle").textContent=title;dialogBody.innerHTML=html;dialog.showModal()}
  function closeDialog(){if(dialog.open)dialog.close()}
  function waLink(text){return`https://wa.me/${WHATSAPP}?text=${encodeURIComponent(text)}`}
  function busy(button,active){if(button){button.disabled=active;if(active)button.dataset.label=button.textContent;else if(button.dataset.label){button.textContent=button.dataset.label;delete button.dataset.label}}}
  async function doBooking(button){if(!selectedOccurrence){toast("Elija un horario disponible");return}const studentId=document.querySelector('input[name="bookingStudent"]:checked')?.value||selectedStudent;if(!studentId){toast("Elija quién va a nadar");return}selectedStudent=studentId;busy(button,true);try{const{occurrence}=await API.book(studentId,selectedOccurrence),student=state.students.find(s=>s.id===studentId),cls=CLASES[occurrence.type],message=`Hola Emily, reservé ${cls.nombre} para ${student?.name||""} el ${titleDate(occurrence.date)} a las ${occurrence.time}`;showDialog("Clase reservada",`<p><strong>${escapeHTML(cls.nombre)}</strong></p><p>${titleDate(occurrence.date,true)} · ${escapeHTML(occurrence.time)}</p><p>${UBICACION}</p><div class="actions"><a class="btn btn-agua" href="${waLink(message)}" target="_blank" rel="noopener">Avisar a la profe por WhatsApp</a><a class="btn btn-lila" href="#cuenta" data-action="dialog-account">Ver mis clases</a></div>`);toast("Clase reservada");render()}catch(e){toast(errorText(e))}finally{busy(button,false)}}
  function rescheduleDialog(id){const b=state.bookings.find(x=>x.id===id),old=state.occurrences.find(o=>occurrenceKey(o.type,o.starts_at)===occurrenceKey(b?.class_type,b?.starts_at));if(!b||!old)return;const available=state.occurrences.filter(o=>o.type===old.type&&o.id!==old.id&&dateFromISO(o.starts_at)-Date.now()>=ANTELACION*3600000&&capacity(o)>0&&!state.bookings.some(x=>x.student_id===b.student_id&&occurrenceKey(x.class_type,x.starts_at)===occurrenceKey(o.type,o.starts_at)&&x.status==="reservada"));const groups={};available.forEach(o=>{const d=fromKey(o.date),m=addDays(d,-((d.getUTCDay()+6)%7));(groups[dateKey(m)]??=[]).push(o)});showDialog("Cambiar fecha",`<p class="muted">Elija otro horario de ${escapeHTML(CLASES[old.type].nombre)}.</p>${Object.entries(groups).map(([week,items])=>`<div class="week"><h3>Semana del ${titleDate(week)}</h3>${items.map(o=>`<label class="radio-row"><input type="radio" name="move-to" value="${escapeHTML(o.id)}"><span><strong>${titleDate(o.date)} · ${escapeHTML(o.time)}</strong><br>${capacity(o)===1?"1 cupo disponible":`${capacity(o)} cupos disponibles`}</span></label>`).join("")}</div>`).join("")||'<p class="empty">No hay otros horarios disponibles.</p>'}<button class="btn btn-lila" data-action="reschedule-confirm" data-id="${escapeHTML(id)}" ${available.length?"":"disabled"}>Confirmar cambio</button>`)}
  function confirmInPage(title,message,action,id){showDialog(title,`<p>${escapeHTML(message)}</p><div class="actions"><button class="btn btn-danger" data-action="${action}" data-id="${escapeHTML(id)}">Sí, confirmar</button><button class="btn btn-outline" data-action="dialog-close">Volver</button></div>`)}
  function isAuthHash(hash){return/access_token|refresh_token|type=|error/i.test(hash||"")}
  async function routeAuthHash(){if(isAuthHash(location.hash)){await new Promise(resolve=>setTimeout(resolve,250));const{data}=await sb.auth.getSession();session=data.session;user=session?.user||null;if(user)await refreshUserData();history.replaceState(null,"",location.pathname+location.search+"#cuenta");render()}}
  async function handleAction(e){const el=e.target.closest("[data-action]");if(!el)return;const{action,id}=el.dataset;try{if(action==="retry"){await loadCatalog();return}if(action==="choose-type"||action==="type-filter"){selectedType=el.dataset.type;selectedOccurrence=null;if(action==="type-filter")render()}if(action==="pick-occurrence"){if(!currentUser()){selectedOccurrence=id;authReturn="#reservar";activeTab="login";location.hash="#ingresar"}else selectedOccurrence=id;render()}if(action==="auth-return-booking"){authReturn="#reservar";activeTab="login"}if(action==="confirm-book")await doBooking(el);if(action==="auth-tab"){activeTab=el.dataset.tab;render()}if(action==="account-tab"||action==="panel-tab"){activeTab=el.dataset.tab;if(action==="panel-tab"){if(activeTab==="agenda")await loadAdminAgenda();if(activeTab==="alumnos")await loadAdminStudents();if(activeTab==="pagos")await loadAdminPayments()}render()}if(action==="forgot-password"){e.preventDefault();const email=$("#email")?.value.trim();if(!email){toast("Escriba su correo electrónico.");return}const{error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});if(error)throw error;toast("Si el correo está registrado, le llegará un enlace para cambiar la contraseña.")}if(action==="logout"){await API.logout();activeTab="clases";location.hash="#clases";render();toast("Sesión cerrada")}if(action==="cancel-start"){const b=state.bookings.find(x=>x.id===id),o=state.occurrences.find(x=>occurrenceKey(x.type,x.starts_at)===occurrenceKey(b.class_type,b.starts_at));confirmInPage("Cancelar clase",`¿Desea cancelar ${CLASES[o.type].nombre} del ${titleDate(o.date)} a las ${o.time}?`,"cancel-confirm",id)}if(action==="cancel-confirm"){await API.cancel(id);closeDialog();render();toast("Clase cancelada")}if(action==="reschedule-start")rescheduleDialog(id);if(action==="reschedule-confirm"){const to=document.querySelector('input[name="move-to"]:checked')?.value;if(!to){toast("Elija una fecha");return}await API.reschedule(id,to);closeDialog();render();toast("Fecha cambiada")}if(action==="report-payment"){await API.reportPayment(id);render();toast("Pago reportado")}if(action==="copy"){try{await navigator.clipboard.writeText(el.dataset.copy);toast("Copiado")}catch{toast("No se pudo copiar")}}if(action==="remove-student")confirmInPage("Quitar alumno","¿Desea quitar este alumno de su cuenta?","remove-confirm",id);if(action==="remove-confirm"){await API.removeStudent(id);closeDialog();render();toast("Alumno eliminado")}if(action==="agenda-shift"){agendaDate=addDays(agendaDate,Number(el.dataset.delta));if(activeTab==="agenda")await loadAdminAgenda();render()}if(action==="admin-cancel-start")confirmInPage("Cancelar reserva","¿Desea cancelar la reserva de este alumno?","admin-cancel-confirm",id);if(action==="admin-cancel-confirm"){await API.adminCancelBooking(id);closeDialog();render();toast("Reserva cancelada")}if(action==="confirm-payment"){await API.adminConfirmPayment(id);render();toast("Pago confirmado")}if(action==="dialog-close")closeDialog();if(action==="dialog-account"){closeDialog();activeTab="clases"} }catch(err){toast(errorText(err))}}
  document.addEventListener("click",handleAction);
  document.addEventListener("change",e=>{if(e.target.name==="bookingStudent")selectedStudent=e.target.value;if(e.target.name==="isSelf"){const n=$("#student-name"),a=$("#student-age"),checked=e.target.checked;if(checked){n.value=$("#reg-name").value;a.value="Persona adulta"}n.readOnly=checked;a.readOnly=checked}});
  document.addEventListener("submit",async e=>{const form=e.target;if(!["authForm","addStudentForm","recoveryForm"].includes(form.id))return;e.preventDefault();const data=Object.fromEntries(new FormData(form)),button=form.querySelector('button[type="submit"]')||form.querySelector("button");busy(button,true);try{if(form.id==="authForm"){const error=$("#form-error");if(error)error.textContent="";if(form.querySelector("#email")){await API.login(data.email,data.password);const u=currentUser();location.hash=authReturn||(u.role==="profe"?"#panel":"#cuenta");authReturn=null;activeTab="clases";render();toast("Sesión iniciada")}else{const errs=[];if(!data.name?.trim())errs.push(["name-error","Escriba su nombre completo."]);if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(data.email||""))errs.push(["reg-email-error","Escriba un correo válido."]);if(!phoneNormalize(data.phone))errs.push(["phone-error","El teléfono debe tener 8 dígitos."]);if((data.password||"").length<8)errs.push(["reg-password-error","Use al menos 8 caracteres."]);if(!form.elements.isSelf.checked&&!data.studentName?.trim())errs.push(["student-name-error","Escriba el nombre del alumno."]);if(!form.elements.isSelf.checked&&!data.studentAge?.trim())errs.push(["student-age-error","Escriba la edad del alumno."]);errs.forEach(([key,msg])=>{const node=$("#"+key);if(node)node.textContent=msg});if(errs.length){if(error)error.textContent="Revise los datos señalados.";return}const res=await API.register({...data,isSelf:form.elements.isSelf.checked});authReturn=null;activeTab="clases";if(!res.session){main.innerHTML=`<section class="content-section"><div class="panel"><h2>Confirme su cuenta</h2><p>Le enviamos un correo a ${escapeHTML(data.email)}. Confirme su cuenta desde ese enlace y luego ingrese.</p><a class="btn btn-lila" href="#ingresar">Ingresar</a></div></section>`;return}location.hash="#cuenta";await refreshUserData();render();toast("Cuenta creada")}}else if(form.id==="addStudentForm"){await API.addStudent(data);render();toast("Alumno agregado")}else{if((data.password||"").length<8)throw Error("Use al menos 8 caracteres.");if(data.password!==data.confirmation)throw Error("Las contraseñas no coinciden.");const{error}=await sb.auth.updateUser({password:data.password});if(error)throw error;recoveryMode=false;location.hash="#cuenta";await refreshUserData();render();toast("Contraseña actualizada")}}catch(err){const target=$("#form-error");if(target)target.textContent=errorText(err);else toast(errorText(err))}finally{busy(button,false)}});
  window.addEventListener("hashchange",()=>{if(isAuthHash(location.hash)){routeAuthHash();return}if(location.hash==="#ingresar"&&!currentUser())activeTab="login";render()});
  dialog.addEventListener("click",e=>{const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeDialog()});
  document.addEventListener("keydown",e=>{if(e.key==="Escape"&&dialog.open)closeDialog()});
  sb.auth.onAuthStateChange(async(event,nextSession)=>{session=nextSession;user=nextSession?.user||null;if(event==="PASSWORD_RECOVERY"){recoveryMode=true;render();return}try{await refreshUserData();if(user&&isAuthHash(location.hash)){history.replaceState(null,"",location.pathname+location.search+"#cuenta")}render()}catch(e){toast(errorText(e))}});
  async function start(){try{const{data,error}=await sb.auth.getSession();if(error)throw error;session=data.session;user=session?.user||null;await loadCatalog();if(isAuthHash(location.hash)){await refreshUserData();history.replaceState(null,"",location.pathname+location.search+"#cuenta")}if(!location.hash)history.replaceState(null,"",location.pathname+location.search+"#clases");render()}catch(e){catalogError=errorText(e);render()}}
  start();
  </script>
